<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intesa Dashboard – Login</title>
<style>body{margin:0;background:#07101c;color:#eef4fb;font:15px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(380px,calc(100% - 40px));background:#101b2b;border:1px solid #263a55;border-radius:14px;padding:26px;box-sizing:border-box}h1{margin:0 0 6px;font-size:23px}.muted{color:#91a3b8}.error{color:#fb7185;margin:12px 0}input{width:100%;box-sizing:border-box;background:#0c1726;color:#eef4fb;border:1px solid #263a55;border-radius:8px;padding:11px;margin:8px 0 12px}button{width:100%;background:#2563eb;color:white;border:0;border-radius:8px;padding:11px;font-weight:700;cursor:pointer}.warn{background:#2a1b10;border:1px solid #6b4b20;border-radius:8px;padding:12px;margin-top:14px}</style></head><body><div class="box"><h1>Intesa Sanpaolo</h1><div class="muted">Core + Swing Dashboard</div>{% if setup_required %}<div class="warn">Dashboard-lösenord är inte konfigurerat. Sätt <b>INTESA_DASHBOARD_PASSWORD</b> i <b>intesa.env</b> och starta om.</div>{% else %}<form method="post"><label for="password">Lösenord</label><input id="password" name="password" type="password" autocomplete="current-password" autofocus required><button type="submit">Logga in</button>{% if error %}<div class="error">{{ error }}</div>{% endif %}</form>{% endif %}</div></body></html>
